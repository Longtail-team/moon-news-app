<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>새벽달 영어뉴스 · 수강생 화면 목업 v2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&display=swap">
<style>
:root{
  --main:#76D4CC; --tint:#E2F6F3; --deep:#1F7F77;
  --bg:#F6F8F8; --line:#E3E9E8; --mute:#EEF2F2; --line2:#D3DCDB;
  --ink:#2D2D2D; --sub:#5A5A5A; --faint:#8A8A8A; --white:#FFFFFF;
  --font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --serif:'Noto Serif KR','Nanum Myeongjo',serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:#E8EEEE;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ink)}
:focus-visible{outline:3px solid var(--deep);outline-offset:2px}

/* ---------- desktop layout ---------- */
.stage{display:flex;gap:32px;justify-content:center;align-items:flex-start;min-height:100%;padding:32px 24px}
.side{width:248px;flex-shrink:0;position:sticky;top:32px;max-height:calc(100vh - 64px);overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-right:4px}
.side h1{font-size:18px;margin:0;line-height:1.4}
.side p{margin:0;font-size:13px;color:var(--sub);line-height:1.6}
.side .grp{display:flex;flex-direction:column;gap:4px}
.side .grp b{font-size:12px;color:var(--deep);margin-bottom:2px;display:flex;align-items:center;gap:6px}
.side .ptag{padding:2px 7px;border-radius:7px;background:#FFE9B8;color:#7A5300;font-size:11px;font-weight:800}
.side .nav{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:10px;font-size:14px}
.side .nav:hover{background:var(--white)}
.side .nav.on{background:var(--white);font-weight:800;box-shadow:inset 3px 0 0 var(--main)}
.side label{font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:4px}
.side label.tg{flex-direction:row;align-items:center;gap:8px;min-height:32px;color:var(--ink);font-weight:700}
.side label.tg input{width:18px;height:18px;accent-color:var(--deep)}
.side select{height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--white);padding:0 10px;font-size:14px}
.side .reset{height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--white);font-size:14px;font-weight:700}
.phone{width:390px;height:844px;flex-shrink:0;border-radius:44px;background:var(--bg);position:relative;overflow:hidden;
  box-shadow:0 0 0 10px #FFFFFF,0 0 0 11px var(--line2),0 24px 60px rgba(31,127,119,.18)}
.menuBtn{display:none}

/* ---------- mobile: phone fills the screen ---------- */
@media (max-width:720px){
  body{background:var(--bg)}
  .stage{padding:0;display:block}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  .side{position:fixed;inset:0;width:auto;max-height:none;z-index:50;background:var(--bg);padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;display:none}
  .side.open{display:flex}
  .menuBtn{display:flex;position:fixed;z-index:60;right:12px;top:calc(10px + env(safe-area-inset-top,0px));height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:rgba(255,255,255,.92);font-size:12px;font-weight:700;align-items:center}
}

/* ---------- phone internals ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.scroll{flex:1;overflow-y:auto;padding-bottom:20px}
.pad{padding:0 16px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px}
.back{display:flex;align-items:center;min-height:44px;min-width:44px;border:0;background:transparent;font-size:15px;font-weight:700;padding:0}
.meta{font-size:13px;color:var(--sub)}
.h1{font-size:24px;font-weight:800;line-height:1.4;letter-spacing:-.3px;margin:0}
.help{font-size:13px;color:var(--sub);line-height:1.6}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px}
.card.lift{box-shadow:0 2px 10px rgba(31,127,119,.07)}
.tinted{background:var(--tint);border-radius:16px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cta{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:12px;border:0;background:var(--main);font-size:17px;font-weight:800;text-decoration:none}
.cta:disabled{background:var(--mute);color:var(--faint);cursor:not-allowed}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--white);font-size:15px;font-weight:700}
.btn2:disabled{color:var(--faint);background:var(--mute);cursor:not-allowed}
.textbtn{border:0;background:transparent;min-height:44px;min-width:44px;font-size:14px;font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;background:var(--tint);font-size:13px;font-weight:800}
.chip{flex-shrink:0;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line2);background:var(--white);font-size:13px;font-weight:700}
.chip.on{border:2px solid var(--deep);background:var(--tint)}
.get{flex-shrink:0;display:flex;align-items:center;gap:4px;min-height:44px;padding:0 14px;border-radius:12px;border:0;background:var(--tint);font-size:14px;font-weight:800}
.play{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);display:flex;align-items:center;justify-content:center}
.input{width:100%;height:52px;border-radius:12px;border:1px solid var(--faint);background:var(--white);padding:0 14px;font-size:16px}
.ta{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--faint);background:var(--white);padding:12px 14px;font-size:16px;line-height:1.6;resize:vertical}
.label{font-size:13px;font-weight:700}
.sec{font-size:13px;font-weight:800;color:var(--sub);margin-top:6px}
.bar{height:8px;border-radius:4px;background:var(--line)}
.bar i{display:block;height:8px;border-radius:4px;background:var(--main)}
.ckl{display:flex;align-items:center;gap:8px;min-height:44px;font-size:13px;font-weight:700;color:var(--sub)}
.ckl input{width:20px;height:20px;accent-color:var(--deep);flex-shrink:0}
.serif{font-family:var(--serif);font-weight:900}

/* tab bar */
.tabs{flex-shrink:0;display:flex;padding:6px 4px calc(14px + env(safe-area-inset-bottom,0px));background:var(--white);border-top:1px solid var(--line)}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;border:0;background:transparent;font-size:13px;color:var(--sub);white-space:nowrap;padding:0 2px}
.tab.on{color:var(--deep);font-weight:800}
.badge{position:absolute;top:2px;left:50%;margin-left:6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--main);color:var(--ink);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* home */
.dots{display:flex;gap:10px}
.dot{width:44px;height:44px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center}
.dot.done{background:var(--main);border-color:var(--main)}
.grid{display:flex;flex-direction:column;gap:6px}
.grow{display:flex;align-items:center;gap:6px}
.wk{width:36px;flex-shrink:0;font-size:14px;font-weight:800}
.wk.future{color:var(--faint)}
.box{width:44px;height:44px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center}
.box.done{background:var(--main)}
.box.miss{background:var(--white);border:2px dashed var(--deep)}
.box.open{background:var(--white);border:1.5px solid var(--line2)}
.box.future{background:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px}
.legend span{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700}
.recHead{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0;border:0;background:transparent;text-align:left}
.reveal{animation:reveal .28s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* activity list */
.act{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--white);text-align:left}
.act .ic,.ic{width:44px;height:44px;flex-shrink:0;border-radius:12px;background:var(--tint);display:flex;align-items:center;justify-content:center}
.tag{margin-left:6px;padding:3px 8px;border-radius:8px;background:var(--tint);font-size:13px;font-weight:800;color:var(--deep)}

/* steps */
.steps{display:flex;gap:6px;padding:0 16px}
.steps div{flex:1;padding:8px 0;text-align:center;border-radius:10px;font-size:13px;font-weight:800;background:var(--mute);color:var(--sub)}
.steps div.on{background:var(--ink);color:var(--white)}

/* reading text + highlight */
.txt .en{font-size:17px;line-height:1.85}
.txt .ko{font-size:14px;line-height:1.75;color:var(--sub);margin:4px 0 16px}
.txt.koMain .ko{font-size:17px;color:var(--ink);line-height:1.85;margin:0}
.txt.koMain .en{font-size:14px;color:var(--sub);line-height:1.75;margin:4px 0 16px}
.ck,.sk{border-radius:5px;padding:1px 0;transition:background-color .15s,box-shadow .15s}
.ck.hl,.sk.hl{background:var(--main);box-shadow:0 0 0 3px var(--main)}
.sl{color:var(--deep);font-weight:800;margin:0 3px}
.rate{display:flex;align-items:center;gap:6px}
.rate span{font-size:13px;font-weight:700;color:var(--sub);margin-right:2px}
.rate button{min-width:52px;height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--white);font-size:13px;font-weight:700}
.rate button.on{border:2px solid var(--deep);background:var(--tint)}
.recText .ck,.recText .sk{font-size:21px;line-height:1.9}
/* recording */
.count{position:absolute;inset:0;background:rgba(246,248,248,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5}
.count b{font-size:96px;line-height:1;color:var(--deep)}
.rec{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800}
.rec i{width:12px;height:12px;border-radius:50%;background:var(--deep);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* listening */
.lbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.lbar i{display:block;height:6px;background:var(--deep);width:0}

/* result bar */
.vbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line2)}
.vbar i{display:block;height:12px;background:var(--main)}

/* 청독 card (1080×1350, scaled) */
.ncard{position:relative;overflow:hidden;flex-shrink:0;border-radius:4px;box-shadow:0 2px 10px rgba(31,127,119,.12)}
.ncard-in{position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:0 0;background:#F6F8F8;color:#2D2D2D;font-family:var(--font)}
.np{position:absolute;inset:64px;background:#fff;border:2px solid #E3E9E8;border-radius:28px;padding:60px 68px;display:flex;flex-direction:column}
.nmast{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:22px;border-bottom:4px solid #2D2D2D}
.nhead{margin-top:52px;line-height:1.12;letter-spacing:-1.5px}
.npills{display:flex;gap:16px;margin-top:36px;flex-wrap:wrap}
.npills span{border:2px solid #2D2D2D;border-radius:999px;padding:10px 28px;font-size:28px;font-weight:700}
.nbox{background:#E2F6F3;border-radius:24px;padding:44px 52px}
.nstamp{position:absolute;width:300px;height:300px;opacity:.86;mix-blend-mode:multiply;pointer-events:none}

/* overlay */
.dim{position:absolute;inset:0;background:rgba(45,45,45,.45);z-index:20;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--white);border-radius:24px 24px 0 0;padding:12px 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .28s ease-out}
.handle{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line2)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}

.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--white);font-size:14px;font-weight:700;padding:12px 18px;border-radius:12px;white-space:nowrap;animation:fade .2s}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="stage">
  <aside class="side" id="side">
    <div>
      <h1>새벽달 영어뉴스<br>수강생 화면 목업 v2</h1>
      <p style="margin-top:6px">2026년 10월 9일 기준 앱 화면을 반영했어요. 버튼을 눌러 실제처럼 넘겨 볼 수 있어요. 기사는 지문 하나를 예시로 넣었고, 이름·날짜·숫자는 예시입니다. 음원은 회의용으로 8초짜리로 줄여 흉내 냅니다.</p>
    </div>
    <div class="grp" id="navList"></div>
    <div class="grp">
      <b>데모 설정</b>
      <button class="reset" id="listen90">청독 90% 들은 걸로</button>
      <label class="tg"><input type="checkbox" id="finTg">완주함 (내 기록 상단 카드)</label>
      <label class="tg"><input type="checkbox" id="endTg">종강 다음 날 (뉴스북 PDF 열림)</label>
      <label class="tg"><input type="checkbox" id="candTg">앵커 후보 상태</label>
      <label>완주 단계
        <select id="tierSel"><option value="on">제때 완주</option><option value="grace">유예 완주</option><option value="late">늦은 완주</option></select>
      </label>
      <label>마감 이후 홈
        <select id="graceSel"><option value="g">유예 중</option><option value="after">유예 종료 후</option></select>
      </label>
      <button class="reset" id="resetBtn">처음 상태로 되돌리기</button>
    </div>
  </aside>
  <main class="phone" id="phone" aria-live="polite"></main>
</div>
<button class="menuBtn" id="menuBtn">화면 목록</button>

<script>
/* ================= icons ================= */
const svg=(d,s=22,stroke='currentColor',w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const BUB='<path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-8l-4 3.5V17H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"></path>';
const TXT=(t,fs)=>`<text x="12" y="13.6" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="${fs}" font-weight="800" fill="currentColor" stroke="none">${t}</text>`;
const HEAD='<path d="M4 15v-3a8 8 0 0 1 16 0v3"></path><rect x="3" y="14" width="4.5" height="6.5" rx="1.8"></rect><rect x="16.5" y="14" width="4.5" height="6.5" rx="1.8"></rect>';
const ACT={
  LI:{name:'청독',short:'청독',d:HEAD,desc:'음원을 끝까지 들으면 1회, 카드를 인스타에 올려요'},
  KR:{name:'한국어 기사 읽기',short:'한국어 읽기',d:BUB+TXT('가','8'),desc:'한글 해석을 소리 내어 읽고 녹음해요'},
  EN:{name:'영어 기사 읽기',short:'영어 읽기',d:BUB+TXT('A','9'),desc:'음원을 듣고 영어로 읽어 녹음해요'},
  VO:{name:'VOCA',short:'VOCA',d:'<rect x="3" y="7.5" width="13" height="13" rx="2"></rect><path d="M8 4h11a2 2 0 0 1 2 2v11"></path>',desc:'단어를 익히고 작성지 사진을 올려요'},
  SU:{name:'기사 요약',short:'기사 요약',d:'<path d="M6.5 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path><path d="M9 8h6M9 12h6M9 16h3.5"></path>',desc:'작성지 사진 1장을 올려요'},
  DE:{name:'찬반토론',short:'찬반토론',d:'<path d="M12 4v15M8 20h8M5 7h14"></path><path d="M2 13a3 3 0 0 0 6 0L5 7z"></path><path d="M16 13a3 3 0 0 0 6 0L19 7z"></path>',desc:'작성지 사진 1장을 올려요'}
};
const aIcon=(k,s=22)=>svg(ACT[k].d,s);
const I={
  play:'<svg width="16" height="16" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M7 4l14 8-14 8z"></path></svg>',
  pause:'<svg width="16" height="16" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"></path></svg>',
  check:svg('<path d="M5 12l5 5 9-10"></path>',18,'currentColor',3),
  dl:svg('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path>',18,'currentColor',2.4),
  home:svg('<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path>',24),
  doc:svg('<path d="M6 3h9l4 4v14H6z"></path><path d="M14 3v5h5"></path>',24),
  up:svg('<path d="M12 16V4M7 9l5-5 5 5M5 20h14"></path>',24),
  book:svg('<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5M8 7h7M8 11h5"></path>',24),
  head:svg(HEAD,22,'var(--deep)'),
  down:svg('<path d="M6 9l6 6 6-6"></path>',20,'currentColor',2.4),
  upc:svg('<path d="M6 15l6-6 6 6"></path>',20,'currentColor',2.4),
  mic:svg('<rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path>',28,'var(--deep)'),
  mark:svg('<path d="M6 3h12v18l-6-4-6 4z"></path>',20,'var(--deep)',2.2),
  cam:svg('<path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle>',22),
  img:svg('<rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path>',22),
  scan:svg('<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M8 10h8M8 14h5"></path>',20),
  star:svg('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path>',22,'var(--deep)')
};

/* ================= sample content ================= */
const ARTICLE={
  title:'RM Opens His Art Collection to the World', level:'약 780L', week:4,
  sents:[
   [1,'What does a pop star collect?','팝 스타는 무엇을 모을까?'],
   [1,'For RM of BTS, / the answer is art.','방탄소년단의 RM에게 그 답은 미술 작품이다.'],
   [1,'For the first time, / RM is sharing his personal art collection / in a museum show.','RM은 처음으로 자신이 모은 미술 작품들을 미술관 전시에서 사람들에게 보여 주고 있다.'],
   [1,'The exhibition, / "RM x SFMOMA: Between You and Me," / is at the San Francisco Museum of Modern Art, / also known as SFMOMA.','\'RM x SFMOMA: Between You and Me\'라는 이 전시는 SFMOMA라고도 불리는 샌프란시스코 현대미술관에서 열리고 있다.'],
   [2,'The show has 178 artworks.','이 전시에는 작품 178점이 있다.'],

  const opt=(k,t,d)=>{const on=S.access===k;return `<button data-access="${k}" style="display:flex;gap:12px;align-items:flex-start;width:100%;padding:16px;border-radius:14px;text-align:left;border:${on?'2px solid var(--deep)':'1px solid var(--line2)'};background:${on?'var(--tint)':'var(--white)'}"><span style="width:22px;height:22px;flex-shrink:0;border-radius:50%;margin-top:1px;border:${on?'7px solid var(--deep)':'2px solid var(--faint)'};background:var(--white)"></span><span class="stack" style="gap:4px"><span style="font-size:15px;font-weight:800">${t}</span><span class="help" style="font-size:13px">${d}</span></span></button>`};
  return `<div class="scroll">${progress(3,'접속 방법과 동의')}
  <div class="pad stack" style="padding-top:22px;gap:20px">
    <h2 class="h1">지우가 본인 휴대폰으로<br>직접 진행하나요?</h2>
    <div class="stack" style="gap:10px">${opt('yes','네, 지우 휴대폰으로 해요','지우에게 별도 접속 링크를 보내요. 보호자도 같은 기록을 볼 수 있어요.')}${opt('no','아니요, 보호자 휴대폰으로 해요','지금 이 휴대폰에서 함께 진행해요. 나중에 추가할 수 있어요.')}</div>
    ${yes?`<div class="stack reveal" style="gap:6px"><label class="label" for="cphone">지우 연락처</label><input class="input" id="cphone" type="tel" placeholder="010-0000-0000"><div class="help">등록을 마치면 이 번호로 지우 전용 접속 링크를 보내드려요. 알림톡은 보호자와 지우 모두에게 가요.</div></div>`:''}
    <div class="card lift"><label class="row" style="align-items:flex-start;gap:10px;font-size:14px;line-height:1.5"><input type="checkbox" style="width:22px;height:22px;margin-top:2px;accent-color:var(--deep)">자녀의 낭독 음성과 작성 이미지 수집·보관에 동의합니다 (필수, 만 14세 미만 보호자 동의)</label>
      <button class="textbtn" style="font-size:13px;color:var(--sub)">보관 기간과 삭제 기준 보기</button></div>
    <div class="row" style="gap:10px"><button class="btn2" style="width:96px;height:56px" data-go="student">이전</button><button class="cta" data-go="home">챌린지 시작하기</button></div>
  </div></div>`;
},

reentry(){
  return `<div class="scroll"><div class="pad stack" style="padding-top:48px;gap:22px">
    <div class="stack" style="gap:8px"><h2 class="h1" style="font-size:26px">다시 들어가기</h2>
      <div class="help" style="font-size:14px">알림톡 링크를 찾을 수 없거나 휴대폰을 바꿨나요?<br>등록한 번호로 새 접속 링크를 보내드려요.</div></div>
    ${!S.sent?`<div class="stack" style="gap:14px"><div class="stack" style="gap:6px"><label class="label" for="rphone">등록한 휴대폰 번호</label><input class="input" id="rphone" type="tel" placeholder="010-0000-0000"><div class="help">보호자 번호와 자녀 번호 모두 사용할 수 있어요.</div></div><button class="cta" data-action="sendLink">접속 링크 받기</button></div>`
    :`<div class="stack reveal" style="padding:20px;border-radius:16px;background:var(--tint);gap:10px"><div style="font-size:16px;font-weight:800">알림톡을 확인해 주세요</div><div style="font-size:14px;line-height:1.6">등록된 번호라면 1분 안에 새 접속 링크가 도착해요. 링크는 24시간 동안 쓸 수 있어요.</div><button class="btn2" style="width:auto;align-self:flex-start;padding:0 14px;height:44px" data-action="resetLink">다른 번호로 받기</button></div>`}
  </div></div>
  <div style="padding:20px;text-align:center"><div class="help">번호가 바뀌었거나 알림톡이 오지 않나요?</div><button class="textbtn">운영팀에 문의하기</button></div>`;
},

home(){
  const w=S.weeks[NOW-1], learned=learnedTotal(), bl=backlog(), gaps=gapWeeks();
  const dots=Array.from({length:5},(_,i)=>`<div class="dot${i<w.length?' done':''}">${i<w.length?I.check:''}</div>`).join('');
  const pct=Math.round(S.posted/60*100);
  let grid='';
  if(S.recOpen){
    const rows=S.weeks.map((acts,wi)=>{const n=wi+1;let b='';for(let i=0;i<5;i++){
      if(i<acts.length)b+=`<div class="box done" role="img" aria-label="${ACT[acts[i]].short}">${aIcon(acts[i])}</div>`;
      else if(n<NOW)b+=`<div class="box miss" role="img" aria-label="빈 칸"></div>`;
      else if(n===NOW)b+=`<div class="box open" role="img" aria-label="빈 칸"></div>`;
      else b+=`<div class="box future"></div>`;}
      return `<div class="grow"><div class="wk${n>NOW?' future':''}">${n}주</div>${b}</div>`}).join('');
    const lg=Object.keys(ACT).map(k=>`<span>${aIcon(k,18)}${ACT[k].short}</span>`).join('');
    const readCnt=countOf('EN');
    const fill=gaps.length?`<button class="textbtn" style="align-self:flex-start;text-decoration:none;color:var(--deep)" data-action="fillGap" data-w="${gaps[0]}">${gaps[0]}주차 빈칸 채우러 가기 ›</button>`:'';
    grid=`<div class="stack reveal" style="padding:4px 0 12px"><div style="font-size:13px;font-weight:700">지금까지 소리 내어 읽은 영어 단어 <b style="color:var(--deep)">${(readCnt*ARTICLE.words).toLocaleString()}</b>개</div><div class="legend">${lg}</div><div class="grid">${rows}</div>${fill}</div>`;
  }
  return `<div class="scroll">
    <div class="topbar"><div style="font-size:18px;font-weight:800">안녕, 지우!</div><button class="chip" style="border-radius:22px;min-height:44px">지우 · 초5 ▾</button></div>
    ${S.live?`<button data-go="materials" class="row" style="margin:0 16px 12px;width:calc(100% - 32px);padding:12px 14px;border-radius:14px;border:0;background:var(--tint);text-align:left">
      <span style="width:48px;height:48px;flex-shrink:0;border-radius:12px;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font-size:13px;font-weight:800;color:var(--deep);line-height:1.1">LIVE</span><span style="font-size:14px;font-weight:800">D-3</span></span>
      <span class="stack" style="gap:2px;flex:1"><span style="font-size:14px;font-weight:800">새벽달 Zoom Live 1회차</span><span class="meta">10월 8일(목) 저녁 8시</span></span><span style="font-size:18px;font-weight:800">›</span></button>`:''}
    <div class="pad"><div class="card lift stack" style="padding:20px">
      <div class="between"><span class="pill">4주차</span><span class="meta">10월 5일 – 11일</span></div>
      <div style="font-size:17px;font-weight:700;line-height:1.4">${ARTICLE.title}</div>
      <div class="row" style="align-items:baseline;gap:8px"><span style="font-size:56px;font-weight:800;line-height:1">${Math.min(w.length,5)}</span><span style="font-size:20px;font-weight:700;color:var(--sub)">/ 5</span><span style="font-size:14px;color:var(--sub);margin-left:4px">이번 주 학습</span></div>
      <div class="dots">${dots}</div></div></div>
    <div class="pad" style="padding-top:12px"><button class="cta" data-go="activity">+ 오늘 학습하기</button></div>
    <div class="pad" style="padding-top:12px"><div class="card stack" style="gap:10px">
      <div class="between"><div style="font-size:17px;font-weight:800">종강 12월 6일(일)</div><span class="pill" style="border-radius:10px">9주 남음</span></div>
      <div class="between" style="align-items:baseline"><div style="font-size:14px;font-weight:700;color:var(--sub)">완주까지 인스타 올리기</div><div style="font-size:16px;font-weight:800">${S.posted} <span style="font-weight:500;color:var(--sub)">/ 60</span></div></div>
      <div class="bar"><i style="width:${pct}%"></i></div></div></div>
    <div class="pad" style="padding-top:12px"><div class="card" style="padding:8px 16px">
      <button class="recHead" data-action="toggleRec" aria-expanded="${S.recOpen}"><span class="stack" style="gap:3px"><span style="font-size:15px;font-weight:800">12주 기록</span><span class="meta">학습 ${learned} / 60${bl?' · '+bl:''}</span></span><span class="row" style="gap:4px;font-size:13px;font-weight:700">${S.recOpen?'접기'+I.upc:'펼쳐 보기'+I.down}</span></button>
      ${grid}</div></div>
  </div>${tabbar('home')}`;
},

activity(){
  const w=S.weeks[S.selWeek-1];
  const cnt=(k)=>w.filter(x=>x===k).length;
  const chips=[NOW,...gapWeeks().reverse()].map(n=>{const left=5-S.weeks[n-1].length;return `<button class="chip${S.selWeek===n?' on':''}" data-week="${n}">${n}주차 · ${n===NOW?'이번 주':left+'회 남음'}</button>`}).join('');
  const item=(k,tag='')=>`<button class="act" data-start="${k}"><span class="ic">${aIcon(k)}</span><span class="stack" style="gap:4px;flex:1"><span style="font-size:16px;font-weight:800">${ACT[k].name}${tag?`<span class="tag">${tag}</span>`:''}</span><span class="help" style="font-size:13px">${ACT[k].desc}</span></span><span class="meta" style="font-size:13px;font-weight:700;white-space:nowrap">${cnt(k)}회</span></button>`;
  return `<div class="scroll">${topBar('home','홈',`${S.selWeek}주차 학습 ${Math.min(w.length,5)} / 5`)}
  <div class="pad stack" style="gap:14px">
    <h2 class="h1">오늘은 무엇을 할까요?</h2>
    <div class="row" style="gap:8px;overflow-x:auto">${chips}</div>
    <div class="stack" style="gap:10px">${item('LI')}${item('KR')}${item('EN')}${item('VO')}${item('SU')}${item('DE')}</div>
    <div class="help">같은 활동을 여러 번 해도 매번 1회로 인정돼요.</div>
  </div></div>`;
},

listen(){
  const w=S.weeks[S.selWeek-1].length;
  const heard=S.heard.enAudio+S.heard.krAudio;
  const lrow=(key,name)=>{const n=S.heard[key];return `<div class="card stack" style="padding:12px 14px;gap:10px"><div class="row"><button class="play" data-play="${key}" aria-label="${name} ${S.playing===key?'멈춤':'재생'}">${S.playing===key?I.pause:I.play}</button><div style="flex:1;font-size:15px;font-weight:800">${name}</div><div class="meta" id="lm-${key}" style="${n?'color:var(--deep);font-weight:800':''}">${n?n+'회 들음':'아직 안 들음'}</div></div><div class="lbar"><i id="lp-${key}" style="width:${Math.round((L.pos[key]||0)*100)}%"></i></div></div>`};
  return `<div class="scroll">${topBar('activity','청독',`${S.selWeek}주차 학습 ${Math.min(w,5)} / 5`)}
  <div class="pad stack" style="gap:10px">
    <h2 class="h1" style="font-size:20px">${ARTICLE.title}</h2>
    <div class="help">음원 하나를 끝까지(90% 이상) 들으면 청독 완료를 누를 수 있어요. 여러 번 들을수록 청독 시간이 쌓여요.</div>
    ${lrow('enAudio','영어 기사 음원')}${lrow('krAudio','새벽달 한영 구간반복')}
    <div class="between" style="flex-wrap:wrap">${rateBar()}</div>
    <label class="ckl"><input type="checkbox" data-action="loop" ${S.loop?'checked':''}>반복 재생</label>
    <div class="tinted between"><span style="font-size:14px;font-weight:800;color:var(--deep)">이번 청독</span><span id="lsec" style="font-size:22px;font-weight:800;font-variant-numeric:tabular-nums">${fmtMS(S.lsec)}</span></div>
    <div class="card stack" style="gap:12px">
      <div class="between"><div style="font-size:13px;font-weight:800">기사 원문</div>
        <button class="chip" style="border-radius:12px" data-action="enOnly">${S.enOnly?'함께 보기':'영어만 보기'}</button></div>
      <label class="ckl"><input type="checkbox" data-action="slash" ${S.slash?'checked':''}>끊어 읽기 표시</label>
      ${articleHTML(true,S.enOnly,false)}
    </div>
  </div></div>
  <div class="pad" style="padding-top:12px;padding-bottom:20px" id="lctaWrap">${lCtaHTML()}</div>`;
},

  return `<div class="scroll"><div class="pad stack" style="padding-top:28px;gap:16px">
    <h2 class="h1" style="font-size:28px">청독 완료!</h2>
    <div style="font-size:15px;line-height:1.6">${S.selWeek}주차 학습 <b>${Math.min(w,5)} / 5</b>. 카드를 저장해서 인스타에 올리면 인증돼요.</div>
    <div style="display:flex;justify-content:center">${cardHTML({w:cardW(),style:'insta',en:c.en,kr:c.kr,sec:c.sec,total:c.total,week:S.selWeek,sx:690,sy:556,rot:-14})}</div>
  </div></div>
  <div class="pad stack" style="padding-top:12px;padding-bottom:20px;gap:10px">

},

reading(){

  return `<div class="scroll" id="readScroll">${topBar('activity',ACT[S.act].name,`${S.selWeek}주차`)}
  <div class="steps"><div class="on">1 듣기</div><div>2 낭독</div><div>3 확인</div></div>
  <div class="pad stack" style="padding-top:14px;gap:10px">
    <div class="tinted stack" style="gap:10px">
      <div style="font-size:13px;font-weight:800;color:var(--deep)">듣기 전에 생각해 봐요</div>
      <div style="font-size:16px;font-weight:700;line-height:1.55">내가 오랫동안 모아 온 물건이 있다면, 그 물건은 나에 대해 무엇을 말해 줄까요?</div>
      <div class="between" style="padding-top:10px;border-top:1px solid rgba(31,127,119,.18)"><span style="font-size:14px;font-weight:800">기사 PDF</span><button class="get" style="background:var(--white)" data-action="pdf" data-name="기사 PDF">${I.dl}받기</button></div>
    </div>
    ${toListen('영어 기사 음원 · 한영 구간반복')}

    <div class="card stack" style="gap:12px">
      <div class="between"><div style="font-size:13px;font-weight:800">${en?'기사 원문':'기사 해석'}</div>
        <button class="chip" style="border-radius:12px" data-action="enOnly">${S.enOnly?'함께 보기':(en?'영어만 보기':'한글만 보기')}</button></div>
      ${en?`<label class="ckl"><input type="checkbox" data-action="slash" ${S.slash?'checked':''}>끊어 읽기 표시</label>`:''}
      ${articleHTML(en,S.enOnly,false)}
    </div>
  </div></div>
  <div class="pad stack" style="padding-top:12px;padding-bottom:20px;gap:6px"><div class="help" style="text-align:center" id="estTime">${S.rate}배로 읽으면 약 ${fmtT((en?EN_TOTAL:KO_TOTAL)/S.rate)} 걸려요 · 이어폰을 끼면 녹음이 더 깨끗해요</div><button class="cta" data-go="recording">낭독 시작</button></div>`;

review(){
  const h=[12,22,34,18,40,52,30,16,44,36,24,48,56,28,14,38,46,20,32,50,26,42,18,36,54,30,22,46,34,16,40,28,50,24,38,18,30,44,20,12];
  const bars=h.map(v=>`<span style="flex:1;height:${v}px;border-radius:2px;background:${S.playing==='mine'?'var(--deep)':'var(--main)'}"></span>`).join('');
  const w=S.weeks[S.selWeek-1].length;

worksheet(){
  const t=S.wsType, m=S.memo;
  const d={SU:['기사 요약 쓰기','이번 주 기사 PDF','요약 작성지는 PDF 뒤쪽에 있어요','요약하기','기사의 핵심을 내 말로 3~5문장에 담아 보세요.'],
           DE:['찬반토론 쓰기','이번 주 기사 PDF','토론 질문지는 PDF 맨 뒤에 있어요','내 입장 쓰기','찬성과 반대 중 하나를 고르고, 이유 두 가지를 기사에서 찾아 써 보세요.'],
           VO:['VOCA 공부','VOCA 정리 PDF','출력하거나 공책에 써도 돼요','단어 익히기','음원을 들으며 단어와 뜻을 따라 써 보세요.']}[t];
  const step=(n,title,inner)=>`<div class="card lift stack"><div class="row" style="gap:10px"><span style="width:28px;height:28px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--deep)">${n}</span><span style="font-size:15px;font-weight:800">${title}</span></div>${inner}</div>`;
  let step4='';
  if(t==='SU'){
    const ocrBox=m.ocr==='pending'
      ?`<div class="tinted stack reveal" style="gap:10px"><div style="font-size:14px;font-weight:800">사진에서 읽은 글자예요. 내가 쓴 것과 같나요?</div>
         <div style="padding:12px;border-radius:12px;background:var(--white);font-size:15px;line-height:1.6">${OCR_SAMPLE}</div>
         <div class="help" style="color:var(--ink)">수정하실래요? 이대로 저장하실래요?</div>
         <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn2" data-action="ocrEdit">수정할게요</button><button class="cta" style="height:48px;font-size:15px" data-action="ocrSave">이대로 저장</button></div></div>`
      :`<button class="btn2" data-action="ocr" ${m.left<=0||!S.ocrConsent?'disabled':''}>${I.scan}사진에서 글자 읽기 (${m.left}번 남음)</button>${!S.ocrConsent?'<div class="help">내 기록 › 설정에서 사진 글자 읽기에 동의하면 쓸 수 있어요.</div>':''}${m.ocr==='saved'?'<div class="help" style="color:var(--deep);font-weight:700">기자수첩에 저장했어요.</div>':''}`;
    step4=step(4,'기자수첩 (선택)',`<div class="help">기사에 내 제목을 붙이고 요약을 옮겨 두면, 12주 뒤 내 영어 뉴스북으로 모아 드려요.</div>
      <div class="stack" style="gap:6px"><label class="label" for="mtitle">내가 붙인 제목</label><input class="input" id="mtitle" data-bind="memoTitle" value="${esc(m.title)}" placeholder="예: RM's Long Self-Introduction"></div>
      <textarea class="ta" id="mtext" data-bind="memoText" aria-label="요약" placeholder="요약을 입력하거나, 사진에서 글자를 읽어 오세요">${esc(m.text)}</textarea>
      ${ocrBox}`);
  }
  if(t==='DE'){
    const v=S.vote;
    step4=step(4,'내 의견 (선택)',`<div class="help">이번 주 일요일 자정까지 낼 수 있어요. 내 의견을 고르면 지금까지의 찬반 결과를 볼 수 있어요.</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="chip${v==='찬성'?' on':''}" data-vote="찬성" aria-pressed="${v==='찬성'}" style="border-radius:12px;min-height:48px;font-size:15px">찬성</button><button class="chip${v==='반대'?' on':''}" data-vote="반대" aria-pressed="${v==='반대'}" style="border-radius:12px;min-height:48px;font-size:15px">반대</button></div>
      ${v?`<div class="stack reveal" style="gap:10px">${voteBar(62,`지금까지 48명 · 내 의견 ${v}`)}<input class="input" data-bind="reason" aria-label="이유" value="${esc(S.reason)}" placeholder="이유를 한 문장으로 써 주세요"></div>`:''}`);
  }
  const pending=t==='SU'&&m.ocr==='pending';
  return `<div class="scroll">${topBar('activity','활동 선택',`${S.selWeek}주차`)}
  <div class="pad stack">
    <h2 class="h1">${d[0]}</h2>
    ${step(1,'작성지 받기',`<div class="row"><div class="stack" style="gap:2px;flex:1"><span style="font-size:15px;font-weight:800">${d[1]}</span><span class="help" style="font-size:13px">${d[2]}</span></div><button class="get" data-action="pdf" data-name="${d[1]}">${I.dl}받기</button></div>
      ${t==='VO'?`<div class="row" style="padding-top:10px;border-top:1px solid var(--mute)"><button class="play" data-play="voAudio" aria-label="VOCA 구간반복 재생">${S.playing==='voAudio'?I.pause:I.play}</button><span class="stack" style="gap:2px"><span style="font-size:14px;font-weight:800">VOCA 구간반복 음원</span><span class="help" style="font-size:13px">한국어–영어 3회</span></span></div>`:''}`)}
    ${step(2,d[3],`<div class="help" style="font-size:13px">${d[4]}</div><button class="textbtn" style="align-self:flex-start;font-size:13px" data-action="readArticle">기사 원문 다시 보기</button>`)}
    ${step(3,'사진 올리기', S.photo
      ?`<div class="row reveal" style="padding:10px;border-radius:12px;background:var(--tint)"><span style="width:52px;height:64px;border-radius:8px;background:var(--white);border:1px solid var(--line);display:flex;align-items:center;justify-content:center">${I.img}</span><span class="stack" style="gap:2px;flex:1"><span style="font-size:14px;font-weight:800">작성지 사진 1장</span><span class="help" style="font-size:13px">10월 9일 촬영</span></span><button class="textbtn" style="font-size:13px" data-action="unphoto">바꾸기</button></div>`
      :`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn2" style="height:72px;border-style:dashed;flex-direction:column;gap:4px;font-size:14px" data-action="photo">${I.cam}사진 찍기</button><button class="btn2" style="height:72px;border-style:dashed;flex-direction:column;gap:4px;font-size:14px" data-action="photo">${I.img}앨범에서 고르기</button></div>
       ${t==='VO'?`<button class="textbtn" style="font-size:13px;align-self:flex-start" data-action="vocaRead">사진 대신 단어 낭독으로 하기</button>`:''}`)}
    ${step4}
  </div></div>
  <div class="pad" style="padding-top:12px;padding-bottom:20px"><button class="cta" data-action="wsDone" ${S.photo&&!pending?'':'disabled'}>${pending?'읽은 글자를 먼저 확인해 주세요':S.photo?'완료하기':'사진을 올리면 완료할 수 있어요'}</button></div>`;
},

queue(){
  const steps=['1. 저장하기','2. 인스타에<br>올리기','3. 링크<br>붙여넣기'].map(t=>`<div style="padding:10px;border-radius:12px;background:var(--tint);font-size:13px;font-weight:700;line-height:1.5">${t}</div>`).join('');
  const items=S.queue.map(q=>`<div class="card stack" style="gap:12px">
    <div class="between"><div class="row" style="gap:10px"><span class="ic" style="width:40px;height:40px;border-radius:10px">${aIcon(q.t)}</span><span class="stack" style="gap:3px"><span style="font-size:16px;font-weight:800">${ACT[q.t].name}</span><span class="meta">${q.meta}</span></span></div>
      <button style="flex-shrink:0;min-height:44px;padding:0 14px;border-radius:12px;border:0;background:var(--ink);color:var(--white);font-size:14px;font-weight:800" data-action="save" data-kind="${q.kind}">${q.kind==='video'?'영상 저장':'사진 저장'}</button></div>
    <label class="label" style="color:var(--sub)" for="u${q.id}">올린 게시물 링크</label>
    <div class="row" style="gap:8px"><input class="input" style="height:48px;font-size:15px;min-width:0;flex:1" id="u${q.id}" placeholder="링크 붙여넣기"><button style="height:48px;padding:0 16px;border-radius:12px;border:0;background:var(--main);font-size:15px;font-weight:800;white-space:nowrap" data-action="verify" data-id="${q.id}">완료</button></div>
  </div>`).join('');
  return `<div class="scroll"><div class="pad stack" style="padding-top:22px">
    <div class="between" style="align-items:baseline"><h2 class="h1">인스타 올리기</h2><span class="meta" style="font-size:14px">완주까지 ${S.posted} / 60</span></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${steps}</div>
    ${S.queue.length?`<div style="font-size:15px;font-weight:800;margin-top:4px">올릴 것 ${S.queue.length}개</div>${items}<div class="help">종강일 12월 6일(일)까지 모두 올려 주세요.</div>`
      :`<div class="card stack" style="align-items:center;text-align:center;padding:28px 16px"><div style="font-size:16px;font-weight:800">지금은 올릴 것이 없어요</div><div class="help">오늘 학습하면 여기에 올릴 것이 생겨요.</div><button class="cta" data-go="activity" style="margin-top:6px">+ 오늘 학습하기</button></div>`}
  </div></div>${tabbar('up')}`;
},

materials(){
  const chip=(n)=>`<button class="chip${n===4?' on':''}">${n}주차</button>`;
  const pdf=(name,sub='')=>`<div class="card row" style="padding:12px 14px"><div class="stack" style="gap:2px;flex:1"><span style="font-size:15px;font-weight:800">${name}</span>${sub?`<span class="meta">${sub}</span>`:''}</div><button class="get" data-action="pdf" data-name="${name}">${I.dl}받기</button></div>`;
  return `<div class="scroll"><div class="pad stack" style="padding-top:22px;gap:10px">
    <h2 class="h1">이번 주 자료</h2>
    <div class="row" style="gap:8px;overflow-x:auto;padding-bottom:2px">${[4,3,2,1].map(chip).join('')}</div>
    <div class="stack" style="gap:2px"><div style="font-size:15px;font-weight:700">${ARTICLE.title}</div><div class="meta" style="font-size:13px">난이도 ${ARTICLE.level} · 본문 ${ARTICLE.words}단어</div></div>
    <div class="sec">PDF</div>${pdf('기사 PDF','원문 · 요약 작성지 · 토론 질문지')}${pdf('VOCA 정리 PDF')}
    <div class="sec">음원</div>${audioRow('enAudio','영어 기사 음원','4:12')}${audioRow('krAudio','한영 구간반복','9:30')}${audioRow('voAudio','VOCA 구간반복','6:05')}
    <div class="sec">라이브</div><div class="row" style="padding:12px 14px;border-radius:14px;background:var(--tint)"><span style="font-size:15px;font-weight:800;flex:1">새벽달 Zoom Live 1회차</span><span style="font-size:13px">10월 8일(목) 저녁 8시</span></div>
  </div></div>${tabbar('doc')}`;
},

record(){
  const learned=learnedTotal(), met=S.weeks.filter(w=>w.length>=5).length, pct=Math.round(S.posted/60*100);
  const pages=[1,2,3,4].filter(n=>pageFilled(n)).length;
  const tiles=['LI','KR','EN','VO','SU','DE'].map(k=>`<div class="stack" style="gap:4px;align-items:center;text-align:center;padding:12px 4px;border-radius:12px;background:var(--bg);border:1px solid var(--line)"><span style="display:flex;color:var(--deep)">${aIcon(k,22)}</span><span style="font-size:20px;font-weight:800;line-height:1.1">${countOf(k)}</span><span style="font-size:13px;color:var(--sub);line-height:1.3">${ACT[k].name}</span></div>`).join('');
  return `<div class="scroll">
    <div class="topbar"><div style="font-size:18px;font-weight:800">내 기록</div><button class="chip" style="border-radius:22px;min-height:44px">지우 · 초5 ▾</button></div>
    <div class="pad stack">
      ${S.finished?`<button data-go="finish" class="tinted row" style="border:0;width:100%;text-align:left;min-height:64px"><span style="flex:1;font-size:15px;font-weight:800;line-height:1.5">12주 완주! 완주 화면에서 첫·마지막 낭독과 상장을 확인해요 ›</span></button>`:''}
      <div class="card lift stack" style="padding:20px">
        <div class="meta" style="font-weight:700">새벽달 영어뉴스 1기 · 이번 기수 기록</div>
        <div class="row" style="align-items:baseline;gap:8px"><span style="font-size:44px;font-weight:800;line-height:1">${S.posted}</span><span style="font-size:18px;font-weight:700;color:var(--sub)">/ 60</span><span style="font-size:14px;color:var(--sub);margin-left:2px">인스타 올리기</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="help">학습 완료 ${learned}회 · 주간 목표 12주 중 ${met}주 달성</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${tiles}</div>
        <div class="stack" style="gap:8px;padding:12px 14px;border-radius:12px;background:var(--mute)">
          <div class="between" style="font-size:14px"><span>지금까지 소리 내어 읽은 영어 단어</span><b style="color:var(--deep)">${(countOf('EN')*ARTICLE.words).toLocaleString()}개</b></div>
          <div class="between" style="font-size:14px"><span>지금까지 청독한 시간</span><b style="color:var(--deep)">${fmtH(S.listenTotal)}</b></div>
        </div>
      </div>
      <div class="tinted stack" style="padding:20px">
        <div class="serif" style="font-size:20px">지우의 영어 뉴스북</div>
        <div style="font-size:14px;line-height:1.6"><b>기사 ${pages} / 12 실림</b> · 청독, 기사 요약, 찬반토론을 하면 한 쪽씩 채워져요</div>
        <button class="cta" data-go="book">뉴스북 보기</button>
        <div class="help" style="text-align:center">${S.afterEnd?'지금 PDF로 받을 수 있어요':'PDF는 12월 7일(월)부터 받을 수 있어요'}</div>
      </div>
      ${anchorCard()}
      <div class="sec">설정</div>
      <div class="card stack" style="gap:10px">
        <div style="font-size:15px;font-weight:800">사진 글자 읽기 (외부 AI)</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="chip${S.ocrConsent?' on':''}" data-consent="1" aria-pressed="${S.ocrConsent}" style="border-radius:12px">동의함</button><button class="chip${!S.ocrConsent?' on':''}" data-consent="0" aria-pressed="${!S.ocrConsent}" style="border-radius:12px">동의 안 함</button></div>
        <div class="help">기자수첩에서 '사진에서 글자 읽기'를 누르면 작성지 사진이 외부 AI로 보내져 글자를 읽어 와요. 동의하지 않아도 요약은 직접 입력할 수 있어요.</div>
      </div>
    </div>
  </div>${tabbar('rec')}`;
},

book(){
  const page=(n)=>{
    const b=BOOK[n], note=S.notes[n], op=S.opinions[n], cards=S.cards[n]||[];
    const head=`<div class="between"><span class="pill">${n}주차</span><span class="meta">${b.dates}</span></div><div style="font-size:16px;font-weight:800;line-height:1.4">${b.title}</div>`;
    if(!pageFilled(n))return `<div class="card stack" style="gap:10px">${head}<div class="help" style="padding:18px 14px;border-radius:12px;border:2px dashed var(--line2);text-align:center">아직 비어 있어요. 청독, 기사 요약, 찬반토론을 하면 이 쪽이 채워져요.</div></div>`;
    return `<div class="card lift stack" style="gap:10px">${head}
      ${note?`<div class="sec" style="margin-top:2px">뉴스 카드</div><div class="row" style="align-items:flex-start;padding:14px;border-radius:12px;background:var(--bg);border:1px solid var(--line)"><div class="stack" style="gap:6px;flex:1"><div style="font-size:16px;font-weight:800">${esc(note.title||'(제목 없음)')}</div><div style="font-size:14px;line-height:1.6">${esc(note.text)}</div><div class="meta">기자 지우</div></div><span title="손글씨 작성지 사진" style="width:40px;height:52px;flex-shrink:0;border-radius:6px;background:var(--white);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--faint)">${svg('<path d="M5 7h14M5 11h10M5 15h12"></path>',18)}</span></div>`:''}
      ${op?`<div class="sec" style="margin-top:2px">의견 카드</div><div class="stack" style="gap:8px;padding:14px;border-radius:12px;background:var(--bg);border:1px solid var(--line)"><div style="font-size:14px">내 입장: <b>${op.side}</b></div><div style="font-size:14px;line-height:1.6">${esc(op.reason)}</div>${op.n?voteBar(op.pro,`최종 결과 ${op.n}명`):''}</div>`:''}
      ${cards.length?`<div class="sec" style="margin-top:2px">청독 카드 ${cards.length}장</div><div style="display:grid;grid-template-columns:repeat(4,70px);gap:8px;justify-content:start">${cards.map((c,i)=>cardHTML(Object.assign({},c,{w:70,style:'app'},STAMP_SPOTS[(i+n)%STAMP_SPOTS.length]))).join('')}</div>`:''}
    </div>`;
  };
  const titles=[1,2,3,4].filter(n=>S.notes[n]&&S.notes[n].title).map(n=>`<div class="between" style="padding:10px 0;border-bottom:1px solid var(--mute);font-size:14px"><span style="color:var(--sub)">${n}주차</span><span style="font-weight:800;text-align:right">${esc(S.notes[n].title)}</span></div>`).join('');
  return `<div class="scroll">${topBar('record','내 기록','')}
  <div class="pad stack">
    <div class="stack" style="gap:6px;padding:28px 22px;border-radius:16px;background:var(--tint)">
      <div style="font-size:13px;font-weight:800;color:var(--deep)">새벽달 영어뉴스 1기</div>
      <div class="serif" style="font-size:24px;margin-top:6px">지우의</div>
      <div class="serif" style="font-size:36px;line-height:1.2">영어 뉴스북</div>
      <div class="meta" style="margin-top:8px">9월 14일(월) – 12월 6일(일) · 읽은 기사 ${NOW}편</div>
    </div>
    ${[1,2,3,4].map(page).join('')}
    <div class="card stack" style="gap:2px"><div style="font-size:15px;font-weight:800;margin-bottom:4px">지우가 붙인 제목</div>${titles||'<div class="help">아직 붙인 제목이 없어요.</div>'}</div>
  </div></div>
  <div class="pad" style="padding-top:12px;padding-bottom:20px">${S.afterEnd?`<button class="cta" data-action="pdf" data-name="영어 뉴스북 PDF">${I.dl}&nbsp;PDF로 받기</button>`:'<button class="cta" disabled>PDF는 12월 7일(월)부터 받을 수 있어요</button>'}</div>`;
},

anchorEntry(){
  const R=[{w:'1주차 · 9월 18일',t:'1:38'},{w:'2주차 · 9월 23일',t:'1:45'},{w:'4주차 · 10월 8일',t:'1:42'}];
  if(S.entryDone){const r=R[S.pick??2];return `<div class="scroll">${topBar('record','내 기록','')}
    <div class="pad stack" style="padding-top:12px;gap:16px">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center">${I.star}</div>
      <h2 class="h1" style="font-size:26px">출품했어요!</h2>
      <div class="card row"><span class="ic">${aIcon('EN')}</span><span class="stack" style="gap:2px;flex:1"><span style="font-size:15px;font-weight:800">영어 기사 읽기</span><span class="meta">${r.w} · ${r.t}</span></span></div>
      <div class="help" style="font-size:14px">수상작은 운영팀이 골라요.</div>
    </div></div>
    <div class="pad stack" style="padding-top:12px;padding-bottom:20px;gap:10px"><button class="cta" data-go="record">내 기록으로</button><button class="btn2" data-go="anchorWin">지난 수상작 보기</button></div>`}
  const item=(r,i)=>{const on=S.pick===i,key='en'+i;return `<div class="row" style="padding:10px 12px;border-radius:14px;border:${on?'2px solid var(--deep)':'1px solid var(--line2)'};background:${on?'var(--tint)':'var(--white)'}">
    <button class="play" data-play="${key}" aria-label="${r.w} 낭독 ${S.playing===key?'멈춤':'재생'}">${S.playing===key?I.pause:I.play}</button>
    <button data-pick="${i}" role="radio" aria-checked="${on}" style="flex:1;display:flex;align-items:center;gap:10px;min-height:48px;border:0;background:transparent;text-align:left;padding:0">
      <span class="stack" style="gap:2px;flex:1"><span style="font-size:15px;font-weight:800">${r.w}</span><span class="meta">영어 기사 읽기 · ${r.t}</span></span>
      <span style="width:22px;height:22px;flex-shrink:0;border-radius:50%;border:${on?'7px solid var(--deep)':'2px solid var(--faint)'};background:var(--white)"></span></button></div>`};
  return `<div class="scroll">${topBar('record','이달의 앵커','1~4주차')}
  <div class="pad stack" style="gap:14px">
    <h2 class="h1">출품할 영어 낭독을<br>골라 주세요</h2>

function seqFor(kind){
  const q=[];
  if(kind==='en') ARTICLE.chunks.forEach((cs,si)=>cs.forEach((c,ci)=>q.push({ids:[`e-${si}-${ci}`],d:T_EN(c)+(ci===cs.length-1?0.35:0)})));
  if(kind==='ko') ARTICLE.sents.forEach((x,si)=>q.push({ids:[`k-${si}`],d:T_KO(x[2])+0.4}));
  if(kind==='kren') ARTICLE.sents.forEach((x,si)=>{const all=ARTICLE.chunks[si].map((c,ci)=>`e-${si}-${ci}`),d=ARTICLE.chunks[si].reduce((n,c)=>n+T_EN(c),0)+0.4;
    q.push({ids:[`k-${si}`],d:T_KO(x[2])+0.4});q.push({ids:all,d});q.push({ids:all,d});});
  return q;
}
const P={seq:null,i:0,t:null,key:null,onEnd:null};
function hl(ids){phone.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));(ids||[]).forEach(id=>{const e=document.getElementById(id);if(e)e.classList.add('hl')});
  const f=ids&&document.getElementById(ids[0]);const sc=f&&f.closest('.scroll');
  if(f&&sc){const r=f.getBoundingClientRect(),b=sc.getBoundingClientRect();if(r.top<b.top+60||r.bottom>b.bottom-60)sc.scrollTo({top:sc.scrollTop+r.top-b.top-b.height/3,behavior:'smooth'})}}
function pStep(){clearTimeout(P.t);if(!P.seq)return;if(P.i>=P.seq.length){const k=P.key,cb=P.onEnd;pStop(true);if(cb)cb(k);return}
  const it=P.seq[P.i];hl(it.ids);P.t=setTimeout(()=>{P.i++;pStep()},it.d*1000/S.rate)}
function pStart(key,kind,onEnd){pStop();P.seq=seqFor(kind);P.i=0;P.key=key;P.onEnd=onEnd;pStep()}
function pStop(clear){clearTimeout(P.t);P.t=null;P.seq=null;P.key=null;if(clear!==false)hl([])}
function setPlayBtn(key,on){document.querySelectorAll(`[data-play="${key}"]`).forEach(b=>{b.innerHTML=on?I.pause:I.play;b.setAttribute('aria-label',on?'멈춤':'재생')})}

/* ================= 청독 재생 흉내 =================
   실제 음원 대신 8초(1배 기준)로 줄여 재생. 하이라이트는 실제 길이 비율대로 나눠 움직임.
   90% 이상 들으면 1회 들음으로 셈. 청독 시간은 실제 음원 길이 기준으로 쌓임. */
const SIM=8;
const L={pos:{enAudio:0,krAudio:0},counted:{enAudio:false,krAudio:false},int:null,idx:-1,seq:null};
const realDur=k=>k==='enAudio'?EN_TOTAL:(KO_TOTAL+EN_TOTAL*2);
function lSeq(k){const q=seqFor(k==='enAudio'?'en':'kren');const tot=q.reduce((n,x)=>n+x.d,0);let c=0;return q.map(x=>{c+=x.d/tot;return {ids:x.ids,end:c}})}
function lCtaHTML(){const ok=S.heard.enAudio+S.heard.krAudio>0;return `<button class="cta" id="lcta" data-action="listenDone" ${ok?'':'disabled'}>${ok?'청독 완료':'음원을 끝까지 들으면 완료할 수 있어요'}</button>`}
function lStop(){clearInterval(L.int);L.int=null;if(S.playing)setPlayBtn(S.playing,false);S.playing=null;hl([])}
function lToggle(k){
  if(S.playing===k){lStop();return}
  lStop();S.playing=k;setPlayBtn(k,true);L.seq=lSeq(k);L.idx=-1;
  L.int=setInterval(()=>lTick(k),100);timers.push(L.int);
}
function lTick(k){
  L.pos[k]+=0.1*S.rate/SIM; S.lsec+=0.1*realDur(k)/SIM;
  if(!L.counted[k]&&L.pos[k]>=0.9){L.counted[k]=true;S.heard[k]++;const m=document.getElementById('lm-'+k);if(m){m.textContent=S.heard[k]+'회 들음';m.style.color='var(--deep)';m.style.fontWeight='800'}const w=document.getElementById('lctaWrap');if(w)w.innerHTML=lCtaHTML()}
  if(L.pos[k]>=1){L.pos[k]=0;L.counted[k]=false;
    if(!S.loop){const p=document.getElementById('lp-'+k);if(p)p.style.width='100%';lStop();lTime();return}
    L.idx=-1}
  const i=L.seq.findIndex(x=>L.pos[k]<x.end);
  if(i!==L.idx){L.idx=i;hl(L.seq[i]?L.seq[i].ids:[])}
  const p=document.getElementById('lp-'+k);if(p)p.style.width=Math.round(L.pos[k]*100)+'%';
  lTime();
}
function lTime(){const e=document.getElementById('lsec');if(e)e.textContent=fmtMS(S.lsec)}

function readPlay(key){
  if(S.playing===key){S.playing=null;setPlayBtn(key,false);pStop();return}
  if(S.playing)setPlayBtn(S.playing,false);
  S.playing=key;setPlayBtn(key,true);
  pStart(key,key==='enAudio'?'en':'kren',k=>{S.playing=null;setPlayBtn(k,false)});
}

const phone=document.getElementById('phone');
let navKey='welcome';
function go(name){clearTimers();clearInterval(L.int);L.int=null;pStop(false);S.playing=null;S.pacerPaused=false;S._sec=0;S.popup=null;S.screen=name;navKey=name;render();phone.querySelector('.scroll')?.scrollTo(0,0)}
function render(){
  phone.innerHTML=`<div class="screen">${SCREENS[S.screen]()}</div>${popupHTML()}`;
  document.getElementById('navList').innerHTML=NAV.map(([g,items,tag])=>`<div class="grp"><b>${g}${tag?`<span class="ptag">${tag}</span>`:''}</b>${items.map(([k,l])=>`<button class="nav${navKey===k?' on':''}" data-nav="${k}">${l}</button>`).join('')}</div>`).join('');
  if(S.screen==='recording'&&!S._recStarted){S._recStarted=true;startRecording()}
  if(S.screen!=='recording')S._recStarted=false;
  if(S.screen==='listen')L.idx=-1;
  if(S.screen==='cert'){const i=document.getElementById('cname');i.addEventListener('input',()=>{document.getElementById('certPreview').textContent=i.value||' '})}
  if(S.screen==='student'){document.getElementById('by').addEventListener('change',e=>{S.by=e.target.value;render()});document.getElementById('bm').addEventListener('change',e=>{S.bm=e.target.value})}
}
function startRecording(){
  let n=3;const cnum=document.getElementById('cnum'),box=document.getElementById('count');
  const t=setInterval(()=>{n--;if(n<=0){clearInterval(t);box.remove();S._sec=0;
    timers.push(setInterval(()=>{S._sec++;const c=document.getElementById('clock');if(c)c.textContent=`${Math.floor(S._sec/60)}:${String(S._sec%60).padStart(2,'0')}`},1000));
    if(S.pacerOn)pStart('pacer',S.act==='EN'?'en':'ko',()=>{});
  }else cnum.textContent=n},1000);
  timers.push(t);
}
function finishLearning(goUp){
  addLearning(S.act,'video');
  const firstEN=S.act==='EN'&&!S.firstShown;
  S.popup=null;
  if(goUp){S.screen='queue';navKey='queue'}else{S.screen='home';navKey='home'}
  if(firstEN){S.firstShown=true;S.popup='first'}
  render();
  if(!firstEN)toast(`${S.selWeek}주차 학습 ${Math.min(S.weeks[S.selWeek-1].length,5)} / 5 완료!`);
}
function listenComplete(){
  addLearning('LI','card');
  const sec=Math.max(1,Math.round(S.lsec));
  S.listenTotal+=sec;
  S.lastCard={en:S.heard.enAudio,kr:S.heard.krAudio,sec,total:S.listenTotal};
  (S.cards[S.selWeek]=S.cards[S.selWeek]||[]).push({week:S.selWeek,date:'10월 9일(금)',stampDate:'2026.10.09',en:S.lastCard.en,kr:S.lastCard.kr,sec,total:S.listenTotal});
  S.heard={enAudio:0,krAudio:0};S.lsec=0;L.pos={enAudio:0,krAudio:0};L.counted={enAudio:false,krAudio:false};
  go('listenDone');
}

document.addEventListener('input',e=>{
  const b=e.target.dataset&&e.target.dataset.bind;if(!b)return;
  if(b==='memoTitle')S.memo.title=e.target.value;
  if(b==='memoText')S.memo.text=e.target.value;
  if(b==='reason')S.reason=e.target.value;
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-go],[data-nav],[data-action],[data-os],[data-access],[data-week],[data-start],[data-play],[data-rate],[data-vote],[data-consent],[data-pick]');
  if(!el)return;
  const d=el.dataset;
  if(d.nav){const [scr,arg]=d.nav.split(':');
    if(scr==='worksheet'){S.wsType=arg;S.photo=false}
    go(scr);navKey=d.nav;render();
    if(arg==='anchor'){const a=document.getElementById('anchorCard');if(a)a.scrollIntoView({block:'start'})}
    document.getElementById('side').classList.remove('open');return}
  if(d.go){go(d.go);return}
  if(d.os){S.os=d.os;render();return}
  if(d.access){S.access=d.access;render();return}
  if(d.week){S.selWeek=Number(d.week);render();return}
  if(d.vote){S.vote=d.vote;render();return}
  if(d.consent){S.ocrConsent=d.consent==='1';render();return}
  if(d.pick){S.pick=Number(d.pick);render();return}
  if(d.start){const k=d.start;if(k==='KR'||k==='EN'){S.act=k;go('reading')}else if(k==='LI'){go('listen')}else{S.wsType=k;S.photo=false;go('worksheet');navKey='worksheet:'+k;render()}return}
  if(d.play){if(S.screen==='listen'){lToggle(d.play);return}if(S.screen==='reading'){readPlay(d.play);return}S.playing=S.playing===d.play?null:d.play;render();return}
  if(d.rate){S.rate=Number(d.rate);document.querySelectorAll('[data-rate]').forEach(b=>{const on=Number(b.dataset.rate)===S.rate;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});const e=document.getElementById('estTime');if(e)e.textContent=`${S.rate}배로 읽으면 약 ${fmtT((S.act==='EN'?EN_TOTAL:KO_TOTAL)/S.rate)} 걸려요 · 이어폰을 끼면 녹음이 더 깨끗해요`;return}
  switch(d.action){
    case 'toggleRec':S.recOpen=!S.recOpen;render();break;
    case 'fillGap':S.selWeek=Number(d.w);go('activity');break;
    case 'sendLink':S.sent=true;render();break;
    case 'resetLink':S.sent=false;render();break;
    case 'enOnly':if(S.screen==='listen'){S.enOnly=!S.enOnly;render();break}pStop(false);if(S.playing){setPlayBtn(S.playing,false);S.playing=null}S.enOnly=!S.enOnly;render();break;
    case 'slash':if(S.screen==='listen'){S.slash=!S.slash;render();break}pStop(false);if(S.playing)S.playing=null;S.slash=!S.slash;render();break;
    case 'loop':S.loop=el.checked;break;
    case 'listenDone':listenComplete();break;
    case 'pacerToggle':S.pacerOn=!S.pacerOn;S.pacerPaused=false;if(S.pacerOn){render();pStart('pacer',S.act==='EN'?'en':'ko',()=>{});}else{pStop();render();}break;
    case 'pacerPause':if(S.pacerPaused){S.pacerPaused=false;if(P.seq)pStep();else pStart('pacer',S.act==='EN'?'en':'ko',()=>{});}else{S.pacerPaused=true;clearTimeout(P.t);}document.getElementById('pauseBtn').textContent=S.pacerPaused?'다시 움직이기':'잠깐 멈추기';break;
    case 'pdf':toast(`${d.name}를 내려받아요 (목업)`);break;
    case 'complete':S.submitUp=false;S.popup='submit';render();break;
    case 'completeUp':S.submitUp=true;S.popup='submit';render();break;
    case 'submitGo':finishLearning(S.submitUp);break;
    case 'closeSheet':S.popup=null;render();break;
    case 'photo':S.photo=true;render();break;
    case 'unphoto':S.photo=false;if(S.memo.ocr==='pending')S.memo.ocr='none';render();break;
    case 'ocr':if(!S.photo){toast('먼저 3번에서 작성지 사진을 올려 주세요');break}if(S.memo.left<=0)break;S.memo.left--;S.memo.ocr='pending';render();break;
    case 'ocrEdit':S.memo.text=OCR_SAMPLE;S.memo.ocr='none';render();{const t=document.getElementById('mtext');if(t){t.focus();t.scrollIntoView({block:'center'})}}break;
    case 'ocrSave':S.memo.text=OCR_SAMPLE;S.memo.ocr='saved';render();toast('기자수첩에 저장했어요');break;
    case 'vocaRead':S.act='EN';toast('단어 낭독 녹음 화면으로 이어져요 (목업)');break;
    case 'readArticle':S.act='EN';go('reading');break;
    case 'wsDone':{const t=S.wsType;addLearning(t,'photo');
      if(t==='SU'&&(S.memo.title||S.memo.text))S.notes[S.selWeek]={title:S.memo.title,text:S.memo.text};
      if(t==='DE'&&S.vote)S.opinions[S.selWeek]={side:S.vote,reason:S.reason||'(이유 없음)'};
      S.photo=false;S.memo.ocr='none';go('home');toast(`${S.selWeek}주차 학습 ${Math.min(S.weeks[S.selWeek-1].length,5)} / 5 완료!`);break}
    case 'save':toast(d.kind==='video'?'사진첩에 영상을 저장했어요 (목업)':d.kind==='card'?'사진첩에 청독 카드를 저장했어요 (목업)':'사진첩에 사진을 저장했어요 (목업)');break;
    case 'verify':{const id=Number(d.id);S.queue=S.queue.filter(q=>q.id!==id);S.posted=Math.min(60,S.posted+1);render();toast(`올리기 완료! 완주까지 ${S.posted} / 60`);break}
    case 'closePopup':S.popup=null;render();toast(`${S.selWeek}주차 학습 ${Math.min(S.weeks[S.selWeek-1].length,5)} / 5 완료!`);break;
    case 'insta':toast('인스타그램 게시물로 이동해요 (목업)');break;
    case 'agree':S.agree=el.checked;render();break;
    case 'enter':if(S.pick==null||!S.agree)break;S.entryDone=true;render();phone.querySelector('.scroll')?.scrollTo(0,0);break;
    case 'issue':{const v=document.getElementById('cname').value.trim();if(!v){toast('이름을 입력해 주세요');return}S.certName=v;S.certIssued=true;go('finish');toast(`'${v}' 이름으로 상장을 보냈어요`);break}
  }
});
document.getElementById('tierSel').addEventListener('change',e=>{S.tier=e.target.value;go('finish')});
document.getElementById('graceSel').addEventListener('change',e=>{S.grace=e.target.value;go('grace')});
document.getElementById('finTg').addEventListener('change',e=>{S.finished=e.target.checked;go('record')});
document.getElementById('endTg').addEventListener('change',e=>{S.afterEnd=e.target.checked;if(S.screen!=='book'&&S.screen!=='record')go('book');else render()});
document.getElementById('candTg').addEventListener('change',e=>{S.anchorCand=e.target.checked;go('record');navKey='record:anchor';render();const a=document.getElementById('anchorCard');if(a)a.scrollIntoView({block:'start'})});
document.getElementById('listen90').addEventListener('click',()=>{
  if(S.screen!=='listen')go('listen');
  lStop();S.heard.enAudio++;S.lsec+=EN_TOTAL*0.9;L.pos.enAudio=0.9;render();toast('영어 기사 음원을 90% 들었어요 (데모)');
});
document.getElementById('resetBtn').addEventListener('click',()=>{clearTimers();clearInterval(L.int);L.int=null;L.pos={enAudio:0,krAudio:0};L.counted={enAudio:false,krAudio:false};S=INIT();navKey='welcome';
  ['finTg','endTg','candTg'].forEach(id=>document.getElementById(id).checked=false);
  document.getElementById('tierSel').value='on';document.getElementById('graceSel').value='g';render()});
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('side').classList.toggle('open'));
render();
</script>
</body>
</html>
